<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>MJLab - 对局</title>
    <meta name="viewport" content="width=device-width, viewport-fit=cover, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <meta name="theme-color" content="#0b0f14">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MJLab">
    <meta name="mobile-web-app-capable" content="yes">
	    <link rel="apple-touch-icon" href="../img/icon-180.auto.png">
    <meta name="robots" content="noindex,follow">
    <link href="../img/icon-96.auto.png" rel="shortcut icon" sizes="96x96">
    <link href="../img/icon-32.auto.png" rel="shortcut icon" sizes="32x32">
    <link href="../img/icon-16.auto.png" rel="shortcut icon" sizes="16x16">
	    <link rel="stylesheet" href="../src/style.css">
	    <style>
		        html, body { margin: 0; height: 100%; overflow: hidden; }
		        /* /hand/：虚拟舞台（1280×720）— 仅作为设计坐标系；实际显示尺寸由 MainView.updateViewport 通过 scale 控制 */
			        #main {
	              touch-action: none;
	              width: 1280px;
	              height: 720px;
	              transform: translate(-50%, -50%) scale(1);
	              transition: opacity 220ms ease;
	              --hand-stage-bg: none;
	              background-image: var(--hand-stage-bg);
	              background-size: 100% 100%;
	              background-repeat: no-repeat;
	              background-position: 0 0;
	            }
            #main.boot-main-hidden {
              opacity: 0;
              pointer-events: none;
            }
	          /* three.js canvas：固定铺满 #main，作为最底层；避免盖住 HTML 装饰层（如桌边） */
	          #main > canvas {
	            position: absolute;
	            inset: 0;
	            width: 100%;
	            height: 100%;
	            z-index: 0;
	          }
		        #overlay {
	            position: fixed;
	            inset: 0;
	            display: none;
	            align-items: center;
	            justify-content: center;
	            padding: 24px;
	            text-align: center;
	            background: rgba(0,0,0,0.85);
	            color: #fff;
	            z-index: 40;
		        }
            #loading {
              --boot-progress: 12;
              position: fixed;
              inset: 0;
              z-index: 30;
              display: flex;
              align-items: center;
              justify-content: center;
              text-align: left;
              color: rgba(255, 255, 255, 0.95);
              background:
                radial-gradient(circle at 50% 18%, rgba(35, 93, 128, 0.28), rgba(8, 14, 20, 0.9) 64%),
                linear-gradient(rgba(0, 0, 0, 0.72), rgba(0, 0, 0, 0.72)),
                url('../img/table.jpg');
              background-repeat: repeat;
              background-size: 512px 512px;
              transition: opacity 220ms ease, visibility 220ms ease;
            }
            #loading::before {
              content: '';
              position: absolute;
              inset: 0;
              backdrop-filter: blur(2px) saturate(0.9);
              pointer-events: none;
            }
            #loading.hidden {
              opacity: 0;
              visibility: hidden;
              pointer-events: none;
            }
            #loading .boot-inner {
              position: relative;
              z-index: 1;
              width: min(90vw, 460px);
              display: flex;
              flex-direction: column;
              gap: 14px;
              padding: 18px 18px 16px;
              border-radius: 6px;
              border: 1px solid rgba(255, 255, 255, 0.2);
              background:
                linear-gradient(168deg, rgba(255,255,255,0.12), rgba(255,255,255,0.02) 42%),
                rgba(6, 15, 24, 0.6);
              box-shadow:
                0 18px 36px rgba(0, 0, 0, 0.42),
                inset 0 1px 0 rgba(255, 255, 255, 0.14);
            }
            #loading .boot-head {
              display: flex;
              align-items: center;
              gap: 12px;
            }
            #loading .boot-meter {
              position: relative;
              flex: 0 0 auto;
              width: 64px;
              height: 64px;
            }
            #loading .boot-progress-ring {
              position: absolute;
              inset: 0;
              border-radius: 50%;
              background: conic-gradient(
                from -90deg,
                #f2c94c calc(var(--boot-progress) * 1%),
                rgba(255, 255, 255, 0.16) 0
              );
            }
            #loading .boot-progress-ring::after {
              content: '';
              position: absolute;
              inset: 6px;
              border-radius: inherit;
              background: rgba(11, 21, 30, 0.9);
              box-shadow: inset 0 1px 4px rgba(0, 0, 0, 0.44);
            }
            #loading .boot-spinner {
              position: absolute;
              inset: 2px;
              border-radius: 50%;
              border: 2px solid transparent;
              border-top-color: rgba(255, 255, 255, 0.96);
              border-right-color: rgba(255, 255, 255, 0.36);
              animation: hand-boot-spin 0.9s linear infinite;
            }
            #loading .boot-meter-core {
              position: absolute;
              inset: 0;
              display: flex;
              align-items: center;
              justify-content: center;
              font-weight: 950;
              font-size: 21px;
              letter-spacing: 0.03em;
              color: rgba(247, 218, 137, 0.95);
              text-shadow: 0 2px 6px rgba(0, 0, 0, 0.55);
            }
            #loading .boot-copy {
              min-width: 0;
              display: flex;
              flex-direction: column;
              gap: 4px;
            }
            #loading .boot-title {
              font-weight: 900;
              font-size: 17px;
              line-height: 1.15;
              letter-spacing: 0.01em;
            }
            #loading .boot-text {
              font-weight: 750;
              font-size: 14px;
              line-height: 1.28;
              color: rgba(255, 255, 255, 0.87);
              word-break: break-word;
            }
            #loading .boot-steps {
              list-style: none;
              margin: 0;
              padding: 0;
              display: grid;
              grid-template-columns: repeat(5, minmax(0, 1fr));
              gap: 6px;
            }
            #loading .boot-step {
              min-width: 0;
              height: 24px;
              border-radius: 6px;
              border: 1px solid rgba(255, 255, 255, 0.12);
              background: rgba(255, 255, 255, 0.04);
              display: flex;
              align-items: center;
              justify-content: center;
              gap: 5px;
              font-size: 11px;
              font-weight: 800;
              line-height: 1;
              color: rgba(255, 255, 255, 0.56);
              overflow: hidden;
              white-space: nowrap;
              user-select: none;
            }
            #loading .boot-step::before {
              content: '';
              width: 5px;
              height: 5px;
              border-radius: 50%;
              background: currentColor;
              opacity: 0.52;
              flex: 0 0 auto;
            }
            #loading .boot-step.is-done {
              color: rgba(247, 218, 137, 0.95);
              border-color: rgba(242, 201, 76, 0.42);
              background: rgba(242, 201, 76, 0.12);
            }
            #loading .boot-step.is-active {
              color: rgba(255, 255, 255, 0.96);
              border-color: rgba(242, 201, 76, 0.68);
              background:
                linear-gradient(180deg, rgba(242, 201, 76, 0.22), rgba(242, 201, 76, 0.08)),
                rgba(255, 255, 255, 0.06);
              box-shadow: inset 0 0 10px rgba(242, 201, 76, 0.18);
            }
            #loading .boot-step.is-active::before {
              opacity: 1;
            }
            #loading .boot-seat-block {
              display: flex;
              flex-direction: column;
              gap: 7px;
            }
            #loading .boot-seat-text {
              font-size: 13px;
              font-weight: 760;
              color: rgba(255, 255, 255, 0.84);
              line-height: 1.24;
              min-height: 16px;
            }
            #loading .boot-seats {
              display: grid;
              grid-template-columns: repeat(4, minmax(0, 1fr));
              gap: 8px;
            }
            #loading .boot-seat {
              height: 8px;
              border-radius: 4px;
              border: 1px solid rgba(255, 255, 255, 0.12);
              background: rgba(255, 255, 255, 0.12);
              box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.35);
              transition: background 180ms ease, border-color 180ms ease, box-shadow 180ms ease;
            }
            #loading .boot-seat.occupied {
              border-color: rgba(242, 201, 76, 0.55);
              background: linear-gradient(90deg, #f8df8a, #d39a3b);
              box-shadow:
                0 0 9px rgba(242, 201, 76, 0.28),
                inset 0 1px 1px rgba(255, 255, 255, 0.2);
            }
            #loading .boot-hint {
              font-size: 12px;
              line-height: 1.3;
              color: rgba(255, 255, 255, 0.64);
            }
            #loading.static .boot-spinner {
              display: none;
            }
            @keyframes hand-boot-spin {
              from { transform: rotate(0deg); }
              to { transform: rotate(360deg); }
            }
            @media (max-width: 520px) {
              #loading .boot-inner {
                width: min(92vw, 420px);
                gap: 12px;
                padding: 16px 14px 14px;
                border-radius: 6px;
              }
              #loading .boot-meter {
                width: 58px;
                height: 58px;
              }
              #loading .boot-title {
                font-size: 16px;
              }
              #loading .boot-text {
                font-size: 13px;
              }
              #loading .boot-step {
                height: 22px;
                font-size: 10px;
                gap: 4px;
              }
            }
            @media (prefers-reduced-motion: reduce) {
              #main,
              #loading {
                transition: none;
              }
              #loading .boot-spinner,
              #loading .boot-seat {
                animation: none;
                transition: none;
              }
            }

          /* 血战交互层：仅在需要选择/响应时出现（不做常驻按钮） */
	          #blood-ui {
	            position: absolute;
	            inset: 0;
	            display: none;
	            z-index: 9;
	            pointer-events: none;
	          }
	          #blood-ui .blood-panel {
	            pointer-events: auto;
	            position: absolute;
	            left: 50%;
	            top: 50%;
	            transform: translate(-50%, -50%);
	            display: flex;
	            flex-direction: column;
	            align-items: center;
	            gap: calc(var(--action-btn, 56px) * 0.18);
	            background: transparent;
	            border: 0;
	          padding: 0;
	          color: rgba(255, 255, 255, 0.92);
	          font-family: var(--mj-font);
	          user-select: none;
	          -webkit-tap-highlight-color: transparent;
	          touch-action: manipulation;
	          }
          #blood-ui .blood-panel.readonly,
          #blood-ui .blood-dingque.readonly {
            pointer-events: none;
          }
          #blood-ui .gb-flower-hints {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 1;
          }
          #blood-ui .gb-flower-hint {
            position: absolute;
            transform: translate(-50%, -100%);
            min-width: 30px;
            height: 18px;
            padding: 0 6px;
            box-sizing: border-box;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.46);
            background:
              linear-gradient(180deg, rgba(255, 216, 148, 0.96), rgba(198, 122, 30, 0.96));
            color: rgba(39, 22, 4, 0.92);
            display: flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
            font-family: var(--mj-font);
            font-size: var(--gb-flower-hint-font, 12px);
            font-weight: 950;
            line-height: 1;
            box-shadow:
              0 1px 2px rgba(0, 0, 0, 0.32),
              0 5px 12px rgba(0, 0, 0, 0.28);
            text-shadow: 0 1px 0 rgba(255, 255, 255, 0.32);
            user-select: none;
          }
		          #blood-ui .blood-title {
		            white-space: nowrap;
		            font-variant-numeric: tabular-nums;
		            font-feature-settings: "tnum" 1;
		            color: rgba(255, 255, 255, 0.92);
		            font-weight: 700;
		            font-size: calc(var(--action-btn, 56px) * 0.26);
		            line-height: 1.1;
		            letter-spacing: 0.02em;
	            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.65);
	          }
	          #blood-ui .blood-row {
	            display: flex;
	            flex-wrap: nowrap;
	            gap: calc(var(--action-btn, 56px) * 0.22);
	          }
		          #blood-ui .blood-btn {
		            appearance: none;
		            -webkit-appearance: none;
		            flex: 0 0 auto;
		            width: var(--action-btn, 56px);
		            height: var(--action-btn, 56px);
		            border-radius: 9999px;
		            border: 1px solid rgba(0, 0, 0, 0.22);
		            padding: 0;
		            display: flex;
		            align-items: center;
		            justify-content: center;
		            cursor: pointer;
		            color: rgba(255, 255, 255, 0.95);
		            font-weight: 900;
		            font-size: calc(var(--action-btn, 56px) * 0.7);
		            line-height: 1;
		            white-space: nowrap;
		            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.45);
		            /* 两层阴影：第一层贴边，避免下方亮色元素“露出一条线”；第二层提供更深的悬浮感 */
		            box-shadow:
		              0 2px 6px rgba(0, 0, 0, 0.32),
		              0 10px 20px rgba(0, 0, 0, 0.35);
	            background:
	              radial-gradient(circle at 30% 30%, rgba(255,255,255,0.55), rgba(255,255,255,0) 42%),
	              radial-gradient(circle at 65% 75%, rgba(0,0,0,0.25), rgba(0,0,0,0) 55%),
	              linear-gradient(160deg, rgba(255,255,255,0.18), rgba(0,0,0,0.25));
		            -webkit-tap-highlight-color: transparent;
		            touch-action: manipulation;
		          }
		          #blood-ui .blood-btn:active {
		            transform: translateY(1px) scale(0.98);
		          }
	          #blood-ui .blood-btn:disabled {
	            opacity: 0.55;
	            filter: grayscale(0.35) saturate(0.6);
	            cursor: default;
	          }
	          #blood-ui .blood-btn:disabled:active {
	            transform: none;
	          }
	          #blood-ui .blood-btn:focus {
	            outline: none;
	          }
              #blood-ui .blood-btn.action-wrong-hu {
                background:
                  linear-gradient(90deg,
                    rgba(255, 255, 255, 0) 0%,
                    rgba(255, 255, 255, 0.14) 18%,
                    rgba(255, 230, 170, 0.2) 45%,
                    rgba(255, 230, 170, 0.2) 55%,
                    rgba(255, 255, 255, 0.14) 82%,
                    rgba(255, 255, 255, 0) 100%),
                  radial-gradient(circle at 30% 30%, rgba(255,255,255,0.5), rgba(255,255,255,0) 42%),
                  radial-gradient(circle at 65% 75%, rgba(0,0,0,0.28), rgba(0,0,0,0) 55%),
                  linear-gradient(160deg, #d85a44, #8f2f28);
                background-size: 220% 100%, 100% 100%, 100% 100%, 100% 100%;
                background-position: -120% 50%, 30% 30%, 65% 75%, 0 0;
                animation: hand-hu-bg-flow 2.6s linear infinite;
                will-change: background-position;
              }
              @media (prefers-reduced-motion: reduce) {
                #blood-ui .blood-btn.action-wrong-hu {
                  animation: none;
                  background-position: 0% 50%, 30% 30%, 65% 75%, 0 0;
                }
              }
		          #blood-ui .blood-btn.action-hu {
		            position: relative;
		            background:
                  linear-gradient(90deg,
                    rgba(255, 255, 255, 0) 0%,
                    rgba(255, 255, 255, 0.16) 18%,
                    rgba(255, 225, 160, 0.26) 45%,
                    rgba(255, 255, 255, 0.1) 50%,
                    rgba(255, 225, 160, 0.26) 55%,
                    rgba(255, 255, 255, 0.16) 82%,
                    rgba(255, 255, 255, 0) 100%),
		              radial-gradient(circle at 30% 30%, rgba(255,255,255,0.55), rgba(255,255,255,0) 42%),
		              radial-gradient(circle at 65% 75%, rgba(0,0,0,0.25), rgba(0,0,0,0) 55%),
		              linear-gradient(160deg, #ff6b6b, #b6312b);
                background-size: 220% 100%, 100% 100%, 100% 100%, 100% 100%;
                background-position: -120% 50%, 30% 30%, 65% 75%, 0 0;
                animation: hand-hu-bg-flow 2.6s linear infinite;
                will-change: background-position;
		          }
              #full.hand-hu-font-ready #blood-ui .blood-btn.action-hu {
                color: transparent;
                text-shadow: none;
              }
		          #blood-ui .blood-btn.action-hu::before {
		            content: '';
		            position: absolute;
		            inset: calc(var(--action-btn, 56px) * -0.018);
		            opacity: 0;
		            background: var(--hand-hu-font, none) center / contain no-repeat;
		            pointer-events: none;
		            filter:
                  drop-shadow(0 2px 2px rgba(0, 0, 0, 0.35))
                  drop-shadow(0 0 10px rgba(255, 255, 255, 0.45));
		          }
              #full.hand-hu-font-ready #blood-ui .blood-btn.action-hu::before {
                opacity: 1;
              }
	              @supports ((-webkit-mask: url('') center / contain no-repeat) or (mask: url('') center / contain no-repeat)) {
                #full.hand-hu-font-ready #blood-ui .blood-btn.action-hu::before {
                  background:
                    linear-gradient(90deg,
                      rgba(255, 255, 255, 0) 0%,
                      rgba(255, 255, 255, 0) 35%,
                      rgba(255, 255, 255, 0.95) 50%,
                      rgba(255, 255, 255, 0) 65%,
                      rgba(255, 255, 255, 0) 100%),
                    linear-gradient(180deg, rgba(255, 255, 255, 0.96), rgba(255, 255, 255, 0.74));
                  background-size: 220% 100%, 100% 100%;
                  background-position: -120% 50%, 0 0;
                  -webkit-mask: var(--hand-hu-font, none) center / contain no-repeat;
                  mask: var(--hand-hu-font, none) center / contain no-repeat;
	                  animation: hand-hu-shimmer 1.45s linear infinite;
	                  will-change: background-position;
	                }
	                @media (prefers-reduced-motion: reduce) {
	                  #full.hand-hu-font-ready #blood-ui .blood-btn.action-hu::before {
	                    animation: none;
	                    background-position: 0% 50%, 0 0;
	                  }
	                }
	              }
                @media (prefers-reduced-motion: reduce) {
                  #blood-ui .blood-btn.action-hu {
                    animation: none;
                    background-position: 0% 50%, 30% 30%, 65% 75%, 0 0;
                  }
                }
	              @keyframes hand-hu-shimmer {
	                from { background-position: -120% 50%, 0 0; }
	                to { background-position: 120% 50%, 0 0; }
	              }
              @keyframes hand-hu-bg-flow {
                from { background-position: -120% 50%, 30% 30%, 65% 75%, 0 0; }
                to { background-position: 120% 50%, 30% 30%, 65% 75%, 0 0; }
              }
		              #blood-ui .blood-btn.secondary.action-pass {
		                position: relative;
		                background:
	                  linear-gradient(90deg,
	                    rgba(255, 255, 255, 0) 0%,
	                    rgba(255, 255, 255, 0.16) 18%,
	                    rgba(255, 225, 160, 0.26) 45%,
	                    rgba(255, 225, 160, 0.26) 50%,
	                    rgba(255, 225, 160, 0.26) 55%,
	                    rgba(255, 255, 255, 0.16) 82%,
	                    rgba(255, 255, 255, 0) 100%),
		                  radial-gradient(circle at 30% 30%, rgba(255,255,255,0.4), rgba(255,255,255,0) 45%),
		                  radial-gradient(circle at 65% 75%, rgba(0,0,0,0.22), rgba(0,0,0,0) 55%),

		                background-size: 220% 100%, 100% 100%, 100% 100%, 100% 100%;
		                background-position: -120% 50%, 30% 30%, 65% 75%, 0 0;
		                animation: hand-hu-bg-flow 2.6s linear infinite;
		                will-change: background-position;
		              }
              #full.hand-guo-font-ready #blood-ui .blood-btn.action-pass {
                color: transparent;
                text-shadow: none;
              }
              #blood-ui .blood-btn.action-pass::before {
                content: '';

                background: var(--hand-guo-font, none) center / contain no-repeat;

              #full.hand-guo-font-ready #blood-ui .blood-btn.action-pass::before {

              }
		              @supports ((-webkit-mask: url('') center / contain no-repeat) or (mask: url('') center / contain no-repeat)) {
		                #full.hand-guo-font-ready #blood-ui .blood-btn.action-pass::before {

		          #blood-ui .blood-btn.action-gang {
		            background:
		              radial-gradient(circle at 30% 30%, rgba(255,255,255,0.55), rgba(255,255,255,0) 42%),
		              radial-gradient(circle at 65% 75%, rgba(0,0,0,0.25), rgba(0,0,0,0) 55%),
		              linear-gradient(160deg, #ffbf66, #c67a1e);

		          #blood-ui .blood-btn.action-peng {
		            background:
		              radial-gradient(circle at 30% 30%, rgba(255,255,255,0.55), rgba(255,255,255,0) 42%),

		          #blood-ui .blood-btn.action-chi {
		            background:

              #blood-ui .blood-btn.action-buhua {
                background:
                  linear-gradient(90deg,
                    rgba(255, 255, 255, 0) 0%,
